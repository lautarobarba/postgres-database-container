name: postgres_db
services:
  postgres_db:
    container_name: postgres_db
    image: postgres:18
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD:?Definir DB_POSTGRES_PASSWORD en .env}
      # Codificación UTF8 y ordenamiento en español (ICU) para todas las bases nuevas
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale-provider=icu --icu-locale=es-AR
    restart: always
    shm_size: 256mb
    healthcheck:
      test: pg_isready -h localhost -U postgres -d postgres || exit 1
      interval: 60s
      retries: 5
      start_period: 1s
      timeout: 10s
    ports:
      - ${DB_PORT}:5432
    volumes:
      # Desde PostgreSQL 18 los datos se guardan en /var/lib/postgresql/18/docker
      - ./database/data:/var/lib/postgresql
      - ./backups:/backups
    extra_hosts:
      - host.docker.internal:host-gateway
